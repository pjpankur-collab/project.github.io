<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caloxy - AI Calorie & Nutrition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-[#0a0f0a] text-white font-sans">
    <nav class="p-6 flex justify-between items-center max-w-6xl mx-auto">
        <div class="text-2xl font-bold flex items-center">
            <span class="text-green-500 mr-2">G</span> Caloxy
        </div>
        <div class="space-x-4">
            <button class="hover:text-green-400">Sign in</button>
            <button class="bg-green-500 text-black px-4 py-2 rounded-full font-semibold hover:bg-green-400">Get started</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto mt-20 text-center px-4">
        <h1 class="text-6xl font-bold mb-6">Snap a meal.<br><span class="text-gray-400">Know everything.</span></h1>
        <p class="text-gray-400 text-lg mb-10">Stop guessing. Take a photo of any food and Caloxy instantly returns calories, macros, and a health score.</p>
        
        <div class="flex justify-center gap-4 mb-12">
            <label class="bg-green-500 text-black px-8 py-4 rounded-xl font-bold cursor-pointer hover:bg-green-400 transition">
                Start tracking free
                <input type="file" id="foodInput" class="hidden" accept="image/*">
            </label>
        </div>

        <div id="resultCard" class="hidden bg-[#161d16] border border-green-900/30 p-8 rounded-3xl text-left shadow-2xl">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <h2 id="foodName" class="text-3xl font-bold text-white">Detecting...</h2>
                    <p id="foodDesc" class="text-gray-400">Analyzing nutritional content...</p>
                </div>
                <div class="bg-green-500/10 text-green-500 px-4 py-2 rounded-lg font-bold border border-green-500/20">
                    <span id="healthScore">--</span>/10 HEALTH
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-[#0a0f0a] p-4 rounded-2xl border border-gray-800">
                    <p class="text-gray-500 text-sm">KCAL</p>
                    <p id="kcal" class="text-2xl font-bold">--</p>
                </div>
                <div class="bg-[#0a0f0a] p-4 rounded-2xl border border-gray-800">
                    <p class="text-gray-500 text-sm">PROTEIN</p>
                    <p id="protein" class="text-2xl font-bold">--</p>
                </div>
                <div class="bg-[#0a0f0a] p-4 rounded-2xl border border-gray-800">
                    <p class="text-gray-500 text-sm">CARBS</p>
                    <p id="carbs" class="text-2xl font-bold">--</p>
                </div>
                <div class="bg-[#0a0f0a] p-4 rounded-2xl border border-gray-800">
                    <p class="text-gray-500 text-sm">FAT</p>
                    <p id="fat" class="text-2xl font-bold">--</p>
                </div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
  </html>
