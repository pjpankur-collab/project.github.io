<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caloxy AI | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        :root { --primary: #2ecc71; --dark: #2c3e50; --light: #ecf0f1; }
        body { font-family: 'Inter', sans-serif; background: var(--light); margin: 0; display: flex; }
        
        /* Sidebar */
        .sidebar { width: 250px; height: 100vh; background: var(--dark); color: white; padding: 20px; position: fixed; }
        .sidebar h2 { color: var(--primary); text-align: center; }
        .nav-link { display: block; color: white; padding: 15px; text-decoration: none; border-radius: 5px; margin: 10px 0; }
        .nav-link:hover, .active { background: var(--primary); }

        /* Main Content */
        .main-content { margin-left: 270px; padding: 30px; width: 100%; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* Dashboard Cards */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .card h3 { margin: 0; color: #7f8c8d; font-size: 0.9rem; }
        .card p { font-size: 1.8rem; font-weight: 600; margin: 10px 0; color: var(--dark); }

        /* Upload Section */
        .upload-box { background: white; padding: 40px; border-radius: 15px; text-align: center; border: 2px dashed var(--primary); margin-top: 30px; }
        #imagePreview { max-width: 300px; margin-top: 20px; border-radius: 10px; display: none; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>Caloxy AI</h2>
    <a href="#" class="nav-link active">Dashboard</a>
    <a href="#" class="nav-link">Meal History</a>
    <a href="#" class="nav-link">Settings</a>
</div>

<div class="main-content">
    <div class="header">
        <h1>Welcome Back, Samir!</h1>
        <div class="date" id="currentDate"></div>
    </div>

    <div class="card-grid">
        <div class="card"><h3>Daily Goal</h3><p>2,200</p></div>
        <div class="card"><h3>Consumed</h3><p id="totalKcal">0</p></div>
        <div class="card"><h3>Remaining</h3><p id="remainingKcal">2,200</p></div>
    </div>

    <div class="upload-box">
        <h3>AI Food Recognition</h3>
        <p>Snap a photo to analyze calories instantly</p>
        <input type="file" id="fileInput" accept="image/*" hidden>
        <button class="btn" onclick="document.getElementById('fileInput').click()">Choose Image</button>
        <center><img id="imagePreview" src=""></center>
        <br>
        <button id="analyzeBtn" class="btn" style="display:none;" onclick="uploadImage()">Analyze Now</button>
    </div>
</div>

<script>
    document.getElementById('currentDate').innerText = new Date().toLocaleDateString();
    const fileInput = document.getElementById('fileInput');
    const imagePreview = document.getElementById('imagePreview');
    const analyzeBtn = document.getElementById('analyzeBtn');

    fileInput.onchange = () => {
        const [file] = fileInput.files;
        if (file) {
            imagePreview.src = URL.createObjectURL(file);
            imagePreview.style.display = 'block';
            analyzeBtn.style.display = 'inline-block';
        }
    }

    async function uploadImage() {
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        
        const response = await fetch('/upload', { method: 'POST', body: formData });
        const data = await response.json();
        
        alert("Detected: " + data.name + " (" + data.kcal + " kcal)");
        location.reload(); // Refresh to update cards from database
    }
</script>
</body>
</html>
