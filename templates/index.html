<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Caloxy - AI Food Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-10">
    <div class="max-w-md mx-auto text-center">
        <h1 class="text-4xl font-bold mb-8 text-green-500">Caloxy</h1>
        
        <label class="bg-green-600 px-6 py-3 rounded-full cursor-pointer font-bold">
            Start tracking free
            <input type="file" id="foodInput" class="hidden" accept="image/*">
        </label>

        <div id="resultCard" class="hidden mt-10 p-6 bg-zinc-900 rounded-3xl border border-zinc-800 text-left">
            <h2 id="foodName" class="text-2xl font-bold mb-4">Detecting...</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-black p-4 rounded-xl border border-zinc-800">
                    <p class="text-zinc-500 text-xs">KCAL</p>
                    <p id="kcal" class="text-xl font-bold">--</p>
                </div>
                <div class="bg-black p-4 rounded-xl border border-zinc-800">
                    <p class="text-zinc-500 text-xs">PROTEIN</p>
                    <p id="protein" class="text-xl font-bold">--</p>
                </div>
            </div>
            <p class="mt-4 text-sm text-zinc-400">Health Score: <span id="healthScore" class="text-green-500">--</span>/10</p>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
